<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="東美発注">
<meta name="theme-color" content="#ffffff">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>東美発注</title>
<style>
:root{--bg:#f4f5f7;--card:#fff;--line:#dcdfe4;--text:#1d2129;--sub:#5c6470;--muted:#8a919c;--accent:#1f5fbf;--accent-bg:#e7f0fc;--ok:#1d7a3e;--ok-bg:#e4f4e9;--warn:#9a5b00;--warn-bg:#fff3dc;--danger:#b42318;--danger-bg:#fdecea;--head:#1f3a5f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif;font-size:15px}
button{font:inherit;border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 14px;color:var(--text);cursor:pointer}
button:active{transform:scale(.98)}
button.primary{background:var(--head);color:#fff;border-color:var(--head)}
button.danger{color:var(--danger);border-color:#f0c4bf}
button.small{padding:5px 10px;font-size:13px}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;color:var(--text);min-width:0}
textarea{width:100%;min-height:60px}
label{font-size:13px;color:var(--sub)}
.app{display:flex;flex-direction:column;height:100%}
header{background:#fff;color:var(--head);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 6px) calc(env(safe-area-inset-right) + 12px) 0 calc(env(safe-area-inset-left) + 12px)}
.hrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-weight:700;font-size:17px;margin-right:6px}
.dept{display:flex;gap:4px}
.dept button{background:#fff;color:var(--sub);border-color:var(--line);padding:6px 12px}
.dept button.on{background:var(--head);color:#fff;border-color:var(--head);font-weight:600}
.pages{display:flex;gap:2px;margin-left:auto}
.pages button{background:transparent;border:none;border-bottom:3px solid transparent;color:var(--sub);border-radius:0;padding:10px 14px}
.pages button.on{color:var(--head);border-bottom-color:var(--head);font-weight:600}
main{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;display:none;flex-direction:column}
.page.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.chips{display:flex;gap:6px;padding:10px 12px;overflow-x:auto;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.chip{border-radius:999px;padding:6px 12px;font-size:14px;white-space:nowrap;position:relative}
.chip.on{background:var(--accent-bg);border-color:var(--accent);color:var(--accent);font-weight:600}
.chip .cnt{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--accent);color:#fff;font-size:12px;text-align:center}
.supinfo{background:#fff;border-bottom:1px solid var(--line);padding:8px 12px}
.supmeta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--sub)}
.supmeta b{color:var(--text);font-weight:600}
.fs{margin-top:6px}
.fsrow{display:flex;justify-content:space-between;font-size:14px}
.bar{height:9px;background:#e9ecf0;border-radius:5px;overflow:hidden;margin-top:4px}
.bar>div{height:100%;background:#e0a100;transition:width .2s}
.bar>div.done{background:var(--ok)}
.fsmsg{font-size:13px;margin-top:3px}
.fsmsg.warn{color:var(--warn)}.fsmsg.ok{color:var(--ok)}.fsmsg.sub{color:var(--sub)}
.toolbar{display:flex;gap:8px;padding:8px 12px;align-items:center;flex-wrap:wrap;background:var(--bg)}
.toolbar input[type=search]{flex:1;min-width:180px}
.chk{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--sub);white-space:nowrap}
.list{background:#fff;border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:110px 1fr 84px 170px;gap:8px;align-items:center;padding:8px 12px;border-bottom:1px solid #eef0f3}
.row.has{background:#f4f9ff}
.row .code{font-size:13px;color:var(--sub);word-break:break-all}
.row .nm{font-size:14px;line-height:1.35}
.row .nm small{display:block;color:var(--muted);font-size:12px}
.row .pr{text-align:right;font-variant-numeric:tabular-nums}
.badge{display:inline-block;font-size:11px;padding:1px 6px;border-radius:6px;margin-left:4px;vertical-align:1px}
.b-lot{background:var(--accent-bg);color:var(--accent)}
.b-warn{background:var(--warn-bg);color:var(--warn)}
.b-sup{background:#eef0f3;color:var(--sub)}
.qty{display:flex;align-items:center;justify-content:flex-end;gap:4px}
.qty button{width:40px;height:38px;padding:0;font-size:20px}
.qty input{width:58px;text-align:center;height:38px;padding:4px}
.noteline{grid-column:2 / -1;display:flex;gap:6px;align-items:center}
.noteline input{flex:1;font-size:13px;padding:6px 8px}
.lotwarn{grid-column:2 / -1;font-size:12px;color:var(--warn)}
.more{padding:16px;text-align:center;color:var(--muted);font-size:13px}
.footer{display:flex;align-items:center;gap:8px;padding:10px 12px calc(env(safe-area-inset-bottom) + 10px);background:#fff;border-top:1px solid var(--line);flex-wrap:wrap}
.tot .s{font-size:12px;color:var(--sub)}.tot .b{font-size:19px;font-weight:700}.tot .g{font-size:12px;color:var(--muted)}
.spacer{flex:1}
.empty{padding:40px 20px;text-align:center;color:var(--sub)}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px;margin:12px}
.card h3{margin:0 0 10px;font-size:16px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px}
.field{display:flex;flex-direction:column;gap:4px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid #eef0f3;padding:8px 6px;text-align:left;vertical-align:top}
table.t th{color:var(--sub);font-weight:500;font-size:13px}
.num{text-align:right;font-variant-numeric:tabular-nums}
.modal-bg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.modal-bg.on{display:flex}
.modal{background:#fff;border-radius:14px;width:min(640px,100%);max-height:90vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 12px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1d2129;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:90;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90%}
.toast.on{opacity:.95}
.loading{position:fixed;inset:0;background:#fff;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--sub)}
#scanv{width:100%;max-height:50vh;background:#000;border-radius:8px}
.err{color:var(--danger);font-size:13px}
/* ---- 発注書 ---- */
#printview{position:fixed;inset:0;background:#d5d9df;z-index:60;display:none;flex-direction:column}
#printview.on{display:flex}
#printview .pbar{display:flex;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;background:#fff;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
#printview .pbar span{color:var(--text);font-size:14px;margin-right:auto}
#sheets{flex:1;overflow:auto;padding:16px}
.sheet{width:210mm;height:297mm;background:#fff;color:#000;margin:0 auto 16px;padding:10mm 10mm 8mm;font-family:"Hiragino Mincho ProN","Hiragino Sans","Noto Sans JP",serif;font-size:9.5pt;line-height:1.35;position:relative;overflow:hidden;transform-origin:top center}
.sh-top{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid #000;padding-bottom:2mm}
.sh-title{font-size:20pt;letter-spacing:8pt}
.sh-no{text-align:right;font-size:9pt}
.sh-mid{display:flex;justify-content:space-between;margin-top:3mm;gap:6mm}
.sh-to .nm{font-size:14pt;border-bottom:1px solid #000;padding-bottom:1mm;min-width:70mm}
.sh-to div{font-size:9.5pt}
.sh-from{text-align:right;font-size:9pt}
.sh-from .nm{font-size:13pt;font-weight:600}
.sh-lead{margin:3mm 0 1.5mm;font-size:9.5pt}
table.sh{width:100%;border-collapse:collapse;table-layout:fixed;font-size:9pt}
table.sh th,table.sh td{border:1px solid #555;padding:0 1.5mm;height:5.8mm;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
table.sh th{background:#e8e8e8;font-weight:600;height:6.5mm}
table.sh td.c,table.sh th.c{text-align:center}table.sh td.r,table.sh th.r{text-align:right}
table.sh tr.tot td{font-weight:600;height:7mm}
table.sh td.fs1{font-size:7.3pt}
table.sh td.fs2{font-size:6.6pt;white-space:normal;line-height:1.05;text-overflow:clip}
.sh-comm{border:1px solid #555;margin-top:3mm;padding:1.5mm 2.5mm;min-height:18mm;white-space:pre-wrap;font-size:9.5pt}
.sh-comm .lb{font-size:8pt;color:#444}
.sh-page{position:absolute;bottom:5mm;right:10mm;font-size:8pt;color:#444}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff;height:auto}
  body>*{display:none!important}
  #printview{display:block!important;position:static;background:#fff}
  #printview .pbar{display:none!important}
  #sheets{padding:0;overflow:visible}
  .sheet{margin:0!important;transform:none!important;page-break-after:always;break-after:page}
  .sheet:last-child{page-break-after:auto;break-after:auto}
}
html.standalone header{padding-top:calc(max(env(safe-area-inset-top), 30px) + 6px)}
html.standalone #printview .pbar{padding-top:calc(max(env(safe-area-inset-top), 30px) + 10px)}
@media (display-mode: standalone){header{padding-top:calc(max(env(safe-area-inset-top), 30px) + 6px)}#printview .pbar{padding-top:calc(max(env(safe-area-inset-top), 30px) + 10px)}}
@media (max-width:820px){.row{grid-template-columns:86px 1fr 70px 150px}.pages button{padding:8px 9px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="hrow">
      <span class="title">東美発注</span>
      <div class="dept" id="dept"></div>
      <div class="pages" id="pages">
        <button data-p="order" class="on">発注</button>
        <button data-p="history">履歴</button>
        <button data-p="master">商品マスタ</button>
        <button data-p="settings">設定</button>
      </div>
    </div>
  </header>
  <main>
    <!-- 発注 -->
    <section class="page on" id="p-order">
      <div class="chips" id="supchips"></div>
      <div class="supinfo" id="supinfo"></div>
      <div class="toolbar">
        <input type="search" id="q" placeholder="商品名・品番・JANで検索（バーコードリーダー可）" autocomplete="off">
        <button id="btn-scan">バーコード読取</button>
        <label class="chk"><input type="checkbox" id="q-all">全仕入先から探す</label>
        <label class="chk"><input type="checkbox" id="q-cart">発注中のみ</label>
        <button class="small" id="btn-newprod">＋商品を登録</button>
      </div>
      <div class="scroll" id="olist-wrap"><div class="list" id="olist"></div><div class="more" id="omore"></div></div>
      <div class="footer">
        <div class="tot"><div class="s" id="f-cnt">0点</div><div class="b" id="f-jo">上代計 ¥0</div><div class="g" id="f-ge"></div></div>
        <div class="spacer"></div>
        <select id="staff-sel"></select>
        <button id="btn-clear" class="small danger">クリア</button>
        <button id="btn-draft">下書き保存</button>
        <button id="btn-preview">発注書を見る</button>
        <button id="btn-confirm" class="primary">発注確定</button>
      </div>
    </section>
    <!-- 履歴 -->
    <section class="page" id="p-history">
      <div class="toolbar">
        <select id="h-sup"><option value="">全仕入先</option></select>
        <select id="h-staff"><option value="">全担当者</option></select>
        <input type="month" id="h-month">
        <span class="spacer"></span>
        <span id="h-cnt" class="chk"></span>
      </div>
      <div class="scroll"><div class="list" id="hlist"></div></div>
    </section>
    <!-- 商品マスタ -->
    <section class="page" id="p-master">
      <div class="toolbar">
        <select id="m-sup"></select>
        <input type="search" id="m-q" placeholder="商品名・品番・JANで検索">
        <label class="chk"><input type="checkbox" id="m-check">要確認のみ</label>
        <button id="m-add" class="small">＋追加</button>
        <button id="m-import" class="small">CSV読込</button>
        <button id="m-export" class="small">CSV出力</button>
        <input type="file" id="m-file" accept=".csv,text/csv" hidden>
      </div>
      <div class="scroll" id="mlist-wrap"><table class="t" id="mtable"></table><div class="more" id="mmore"></div></div>
    </section>
    <!-- 設定 -->
    <section class="page" id="p-settings">
      <div class="scroll" id="settings"></div>
    </section>
  </main>
</div>

<div class="modal-bg" id="modal"><div class="modal" id="modal-body"></div></div>
<div id="printview">
  <div class="pbar"><span id="pv-title">発注書</span>
    <button id="pv-print" class="primary">印刷・PDF</button>
    <button id="pv-close">閉じる</button>
  </div>
  <div id="sheets"></div>
</div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div style="font-size:18px;font-weight:600">東美発注</div><div id="loading-msg">起動中…</div></div>

<script>if(navigator.standalone||matchMedia("(display-mode: standalone)").matches)document.documentElement.classList.add("standalone")</script>
<script src="zxing.min.js"></script>
<script src="app.js"></script>
</body>
</html>
